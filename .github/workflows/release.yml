name: CI/CD

on:
  push:
    branches: [ '**' ]
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -P assembly,installer -Dinstall4j.licenseKey=${{ secrets.INSTALL4J_LICENSE_KEY }} clean install

      - name: Upload Linux Assets
        if: github.event_name == 'release' && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            soapui-installer/target/assemblies/*-linux-bin.tar.gz
            soapui-installer/target/install4j/*.sh

      - name: Upload Windows Assets
        if: github.event_name == 'release' && matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            soapui-installer/target/assemblies/*-windows-bin.zip
            soapui-installer/target/install4j/*.exe

      - name: Upload macOS Assets
        if: github.event_name == 'release' && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            soapui-installer/target/assemblies/*-mac-*.zip
            soapui-installer/target/install4j/*.dmg
