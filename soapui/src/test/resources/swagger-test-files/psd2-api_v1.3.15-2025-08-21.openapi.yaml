      description: Body of the response for a successful bulk payment initiation extended status request in case of an JSON based endpoint.
      type: object
      required:
        - groupStatus
      properties:
        groupStatus:
          $ref: "#/components/schemas/groupStatus"
        reasonCode:
          $ref: "#/components/schemas/statusReasonCode"
