    additionalInformationStructured:
      description: |
        Is used if and only if the bookingStatus entry equals "information". 
        Every active standing order related to the dedicated payment account result into one entry.
      type: object
      required:
        - standingOrderDetails
      properties:
        standingOrderDetails:
          $ref: "#/components/schemas/standingOrderDetails"


    standingOrderDetails:
      description: |
        See document \"openFinance API Framework Data Dictionary\", section \"Standing Order Details\" for more details.
      type: object
      required:
        - frequency
      properties:
        startDate:
          description: |
            The first applicable day of execution starting from this date the first payment was/will be executed.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        startDateTime:
          description: |
            The first applicable day and time of execution starting from this timestamp. This attribute is only applicable to instant payments. 
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        endDate:
          description: |
            The last applicable day of execution
            If none of the attributes is given, it is an infinite standing order.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        endDateTime:
          description: |
            The last applicable day and time of requested execution. This attribute is only applicable to instant payments.
            If none of the attributes is given, it is an infinite standing order.
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        executionRule:
          $ref: "#/components/schemas/executionRule"
        withinAMonthFlag:
          description: |
            This element is only used in case of frequency equals \"Monthly\".
            If this element equals false it has no effect. If this element equals true,
            then the execution rule is overruled if the day of execution would fall into a different month using the execution rule.
            Example: executionRule equals \"preceding\", dayOfExecution equals \"02\" and the second of a month is a Sunday.
            In this case, the transaction date would be on the last day of the month before.
            This would be overruled if withinAMonthFlag equals true and the payment is processed on Monday the third of the Month.
            Remark: This attribute is rarely supported in the market.
          type: boolean
        frequency:
          description: |
            The frequency of the recurring payment resulting from this standing order.
          allOf:
            - $ref: '#/components/schemas/frequencyCode'
        multiplicator:
          description: |
            This is multiplying the given frequency resulting the exact frequency, e.g.
            Frequency=weekly and multiplicator=3 means every 3 weeks.
            Remark: This attribute is rarely supported in the market.
          type: number
        dayOfExecution:
          $ref: "#/components/schemas/dayOfExecution"
        limitAmount:
          description: |
            limitAmount
            Amount limit for fund skimming, e.g. skim all funds above this limit to savings account, i.e. typically a specific periodic
            payments with fixed remaining amount rather than fixed transaction amount. Amount may be zero as well as below zero, i.e. negative.
            Constraints: transactionAmount needs to be zero and bankTransactionCode needs to specify \"PMNT-MCOP-OTHR\" for fund skimming.
          allOf:
            - $ref: '#/components/schemas/amount'


    chequeTypeCode:
      description: |
        Specifies the type of cheque to be issued. 
        This code set is identical to ChequeType2Code as defined by ISO20022:
        - 'CCHQ' : 'Customer Cheque' - 
        Cheque drawn on the account of the debtor, and debited on the debtor's account when the cheque is cashed. Synonym is 'corporate cheque'.
        - 'CCCH' : 'Certified Customer Cheque' - 
        Cheque drawn on the account of the debtor, and debited on the debtor's account when the cheque is cashed. The financial institution prints and certifies the cheque, guaranteeing the payment.
        - 'BCHQ' :	'Bank Cheque' -
        Cheque drawn on the account of the debtor's financial institution, which is debited on the debtor's account when the cheque is issued. These cheques are printed by the debtor's financial institution and payment is guaranteed by the financial institution. Synonym is 'cashier's cheque'.
        - 'DRFT' : 'Draft' -
         A guaranteed bank cheque with a future value date (do not pay before], which in commercial terms is a 'negotiatable instrument': the beneficiary can receive early payment from any bank under subtraction of a discount. The ordering customer's account is debited on value date
        - 'ELDR' : 'Electronic Draft' -
         An instrument with a future value date (do not pay before), which in commercial terms is a 'negotiatable instrument': the beneficiary can receive early payment from any bank under subtraction of a discount. The ordering customer's account is debited on value date.
      type: string
      enum:
        - "CCHQ"
        - "CCCH"
        - "BCHQ"
        - "DRFT"
        - "ELDR"
      example:
        "DRFT"

    chequeDepositStatus:
      description: |
        Represents the status of the deposited cheque as a code or proprietary text.
          * 'deposited' :	
            The cheque is held by the ASPSP until due date, then paid out.
          * 'paidOut' :
          	The cheque has already been paid out.
          * 'discountPayout' :
          	The cheque has been paid out prematurely with a discount.
          * 'depositeCancelled' :
          	The deposit was cancelled by the PSU (payee). The cheque is no longer deposited at the account.
          * 'chargeBack' :
          	The cheque has been charged back.
      type: string
      enum:
        - "deposited"
        - "paidOut"
        - "discountPayout"
        - "depositeCancelled"
        - "chargeBack"
      example:
        "paidOut"

