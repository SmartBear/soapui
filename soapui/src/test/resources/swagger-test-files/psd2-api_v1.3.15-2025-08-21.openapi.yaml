    # Content of Request Bodies - XML
    #####################################################

      #####################################################
      # Content of Request Bodies - Single Part
      #####################################################

    paymentInitiationSct_pain.001: #The same schemas are use for single a bulk payment in case of a pain.001
      description: |
        A pain.001 structure corresponding to the SCT schema
        
        urn:iso:std:iso:20022:tech:xsd:pain.001.001.03
      type: string
      example:
        <Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03">
          <CstmrCdtTrfInitn>
            <GrpHdr>
              <MsgId>MIPI-123456789RI-123456789</MsgId>
              <CreDtTm>2017-02-14T20:23:34.000Z</CreDtTm>
              <NbOfTxs>1</NbOfTxs>
              <CtrlSum>123</CtrlSum>
              <InitgPty>
                <Nm>PaymentInitiator</Nm>
                <Id><OrgId><Othr><Id>DE10000000012</Id>
                  <SchmeNm><Prptry>PISP</Prptry></SchmeNm></Othr></OrgId></Id>
              </InitgPty>
            </GrpHdr> 
            <PmtInf> 
              <PmtInfId>BIPI-123456789RI-123456789</PmtInfId>
              <PmtMtd>TRF</PmtMtd> 
              <NbOfTxs>1</NbOfTxs>
              <CtrlSum>123</CtrlSum>
              <PmtTpInf><SvcLvl><Cd>SEPA</Cd></SvcLvl></PmtTpInf>
              <ReqdExctnDt>2017-02-15</ReqdExctnDt>
              <Dbtr><Nm>PSU Name</Nm></Dbtr>
              <DbtrAcct><Id><IBAN>DE87200500001234567890</IBAN></Id></DbtrAcct>
              <ChrgBr>SLEV</ChrgBr>
              <CdtTrfTxInf>
                <PmtId><EndToEndId>RI-123456789</EndToEndId></PmtId> 
                <Amt><InstdAmt Ccy="EUR">123</InstdAmt></Amt>
                <Cdtr><Nm>Merchant123</Nm></Cdtr>
                <CdtrAcct><Id><IBAN> DE23100120020123456789</IBAN></Id></CdtrAcct>
                <RmtInf><Ustrd>Ref Number Merchant-123456</Ustrd></RmtInf>
              </CdtTrfTxInf>
            </PmtInf>
          </CstmrCdtTrfInitn>
        </Document>

    paymentInitiationSctInst_pain.001: #The same schemas are use for single a bulk payment in case of a pain.001
      description: |
        A pain.001 structure corresponding to the SCT INST schema.
      type: string

    paymentInitiationTarget2_pain.001: #The same schemas are use for single a bulk payment in case of a pain.001
      description: |
        A pain.001 structure corresponding to the target-2 schema.
        
        For TARGET-2 payments only community wide pain.001 schemes do exist.
      type: string

    paymentInitiationCrossBorder_pain.001: #The same schemas are use for single a bulk payment in case of a pain.001
      description: |
        A pain.001 structure corresponding to the cross-border schema.

        For cross-border payments only community wide pain.001 schemes do exist.
      type: string

      #####################################################
      # Content of Request Bodies - XML -Multipart
      #####################################################

    periodicPaymentInitiationMultipartBody:
      description: |
       The multipart message definition for the initiation of a periodic payment initiation 
       where the information of the payment is contained in a pain.001 message (Part 1) and 
       the additional information related to the periodic payment is an additional JSON message (Part 2).
      type: object
      properties:
        xml_sct: #PART 1
          oneOf: #The same schemas are used for single and bulk payment in case of a pain.001
            - $ref: "#/components/schemas/paymentInitiationSct_pain.001"
            - $ref: "#/components/schemas/paymentInitiationSctInst_pain.001"
            - $ref: "#/components/schemas/paymentInitiationTarget2_pain.001"
            - $ref: "#/components/schemas/paymentInitiationCrossBorder_pain.001"
        json_standingorderType: #PART 2
          $ref: "#/components/schemas/periodicPaymentInitiation_xml-Part2-standingorderType_json"

    periodicPaymentInitiation_xml-Part2-standingorderType_json:
      description: |
        The body part 2 of a periodic payment initiation request contains the execution related information 
        of the periodic payment.
      type: object
      required:
        - frequency
      properties:
        startDate:
          description: |
            The first applicable day of execution starting from this date the first payment was/will be executed.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        startDateTime:
          description: |
            The first applicable day and time of execution starting from this timestamp. This attribute is only applicable to instant payments. Seconds and milli seconds might be ignored by the ASPSP.
            The ASPSP might restrict the implementation to startDate. This restriction will be part of the ASPSP documentation.
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        executionRule:
          $ref: "#/components/schemas/executionRule"
        endDate:
          description: |
            The last applicable day of execution
            
            If not given, it is an infinite standing order.
          allOf:
            - $ref: '#/components/schemas/ISODate'
        endDateTime:
          description: |
            The last applicable day and time of requested execution. This attribute is only applicable to instant payments.
            If none of the attributes is given, it is an infinite standing order.
            The ASPSP might restrict the implementation to endDate. This restriction will be part of the ASPSP documentation.
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
        frequency:
          $ref: "#/components/schemas/frequencyCode"
        dayOfExecution:
          $ref: "#/components/schemas/dayOfExecution"
        monthsOfExecution:
          $ref: "#/components/schemas/monthsOfExecution"


#####################################################
# Content of Response Bodies
#####################################################


    paymentInitiationStatusResponse-200_json:
      description: Body of the response for a successful payment initiation status request in case of an JSON based endpoint. *Remark:* If the PSU does not complete a required SCA within the required timeframe the payment resource's status must be set to "RJCT". Particularly, if a multi-level-SCA is required and the number of successful SCAs during the required timeframe is insufficient, the status must also be set to "RJCT".
      type: object
      required:
        - transactionStatus
      properties:
        transactionStatus:
          $ref: "#/components/schemas/transactionStatus"
        fundsAvailable:
          $ref: "#/components/schemas/fundsAvailable"
        psuMessage:
          $ref: "#/components/schemas/psuMessageText"
        ownerNames:
          description: |
            List of owner names. Should only be delivered after successful SCA. Could be restricted to the current PSU by the ASPSP.
          type: array
          items: 
            $ref: "#/components/schemas/accountOwner"
        psuName:
          description: |
            Name of the PSU. In case of a corporate account, this might be the person acting on behalf of the corporate.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        _links:
          $ref: "#/components/schemas/_linksPaymentInitiationStatus"
        tppMessage:
          type: array
          items: 
            $ref: "#/components/schemas/tppMessageGeneric"
          description: Messages to the TPP on operational issues.
        originalTransactionInformationAndVopStatus:
          description: |
            Provides Verification of Payee result information on the original transactions.
          type: array
          items: 
            $ref: "#/components/schemas/originalTransactionInformationAndVopStatus"
        challengeData:
          description: |
            Challenge data might be contained, 
                if only one authentication method is available,
                if the Embedded SCA approach is chosen by the ASPSP,
            and if the challenge could not be transported yet via the /authorisations endpoints yet due to ongoing VOP processing.
          allOf:
            - $ref: '#/components/schemas/challengeData'
        scaMethods:
          description: |
            Might be contained, 
                if several authentication methods are available and not yet selected (name, type), 
            and if the related information could not be provided yet via the /authorisations endpoints yet due to ongoing VOP processing.
          type: array
          items: 
            $ref: "#/components/schemas/authenticationObject"


