                  allOf:
                    - $ref: '#/components/schemas/accountReference'
                partyAgent:
                  description: |
                  allOf:
                    - $ref: '#/components/schemas/agentDescription'
                party:
                  description: |
                    This structure shall contain the party name and/or a  party identifier, 
