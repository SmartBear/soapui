        '404':
          $ref: "#/components/responses/NOT_FOUND_404_SBS"
        '405':
          $ref: "#/components/responses/METHOD_NOT_ALLOWED_405_SBS"
        '406':
          $ref: "#/components/responses/NOT_ACCEPTABLE_406_SBS"
        '408':
          $ref: "#/components/responses/REQUEST_TIMEOUT_408_SBS"
        '409':
