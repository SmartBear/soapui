              $ref: "#/components/examples/accountDetailsMulticurrencyAccount"


    OK_200_CardAccountDetails:
      description: OK
      
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      
      content:
        application/json:
          schema:
            type: object
            required:
